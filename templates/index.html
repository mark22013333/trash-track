<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#123b3a">
    <title>新莊西盛街垃圾車即時動態</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIINfQ3ynhTTxcwBNhMZbMZ4nOlQpHOYk=" crossorigin="">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  </head>
  <body>
    <header class="masthead">
      <a class="brand" href="/" aria-label="回首頁">
        <span class="brand-mark" aria-hidden="true">環</span>
        <span>新北清運觀測站</span>
      </a>
      <span class="live-badge"><i></i> 官方資料同步</span>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="hero-copy">
          <p class="eyebrow">XINZHUANG · LIVE ROUTE</p>
          <h1 id="page-title">新莊西盛街<br><em>垃圾車即時動態</em></h1>
          <p class="intro">把清運路線、表定站點與出勤車輛放在同一張地圖上。少一點追車，多一點從容。</p>
        </div>

        <form id="search-form" class="search-panel" role="search">
          <label>
            <span>行政區</span>
            <input id="district" name="district" maxlength="20" value="{{ default_district }}" required>
          </label>
          <label>
            <span>道路名稱</span>
            <input id="street" name="street" maxlength="50" value="{{ default_street }}" required>
          </label>
          <button type="submit">查詢清運動態 <span aria-hidden="true">↗</span></button>
        </form>
      </section>

      <section class="dashboard" aria-live="polite">
        <div class="status-strip">
          <div><span class="metric-label">相關路線</span><strong id="route-count">—</strong><small>條</small></div>
          <div><span class="metric-label">出勤車輛</span><strong id="truck-count">—</strong><small>台</small></div>
          <div class="update-cell"><span class="metric-label">本頁資料更新</span><time id="updated-at">載入中…</time></div>
        </div>

        <div id="notice" class="notice loading" role="status">
          <span class="notice-icon" aria-hidden="true">◌</span>
          <div><strong>正在取得清運資訊</strong><p>第一次載入路線資料可能需要幾秒鐘。</p></div>
        </div>

        <div class="map-frame">
          <div class="map-heading">
            <div><span class="section-index">01</span><h2>清運動態地圖</h2></div>
            <div class="legend"><span><i class="dot stop-dot"></i>清運站</span><span><i class="dot truck-dot"></i>垃圾車</span></div>
          </div>
          <div id="map" aria-label="垃圾車與清運站地圖"></div>
        </div>
      </section>

      <section class="content-grid">
        <div class="panel trucks-panel">
          <div class="section-title"><span class="section-index">02</span><div><p>LIVE VEHICLES</p><h2>目前出勤</h2></div></div>
          <div id="truck-list" class="card-list"><div class="skeleton-card"></div></div>
        </div>
        <div class="panel routes-panel">
          <div class="section-title"><span class="section-index">03</span><div><p>SCHEDULE</p><h2>路線與站點</h2></div></div>
          <div id="route-list" class="route-list"><div class="skeleton-line"></div><div class="skeleton-line short"></div></div>
        </div>
      </section>
    </main>

    <footer>
      <p>資料來源：新北市政府資料開放平臺</p>
      <p>GPS 約每數分鐘更新；非清運時段查無車輛是正常狀況。</p>
    </footer>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script>
      window.TRASH_TRACK_DEFAULTS = {{ {"district": default_district, "street": default_street} | tojson }};
    </script>
    <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  </body>
</html>
